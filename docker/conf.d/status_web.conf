[program:status_web]
command=/usr/local/bin/python3.11 -u /app/status_server.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/status_web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
