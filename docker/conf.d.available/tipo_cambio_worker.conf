[program:tipo_cambio_worker]
command=/usr/local/bin/python3.11 -u cron_sync_tipo_cambio.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tipo_cambio_worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true