[program:telegram_worker]
command=python3 /app/cron_sync_telegram.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/telegram_worker.log
stderr_logfile=/var/log/supervisor/telegram_worker_err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true
