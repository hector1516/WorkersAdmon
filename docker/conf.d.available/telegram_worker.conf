[program:telegram_worker]
; -u: los logs salen al instante (sin esto, al reiniciar se pierde el buffer y
;     no se sabe qué mensaje tumbó al worker).
; startretries=10: si un adjunto hace segfault, supervisor lo vuelve a levantar;
;     la recuperación de ENVIANDO cuenta el intento y tras 3 lo marca FALLADO,
;     así que no se queda en un ciclo infinito de reinicios.
command=/usr/local/bin/python3.11 -u /app/cron_sync_telegram.py
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/var/log/supervisor/telegram_worker.log
stderr_logfile=/var/log/supervisor/telegram_worker_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
