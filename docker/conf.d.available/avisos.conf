; Origen: field/docker/supervisord.conf — migrado a workersadmon 2026-09-26.
; avisos: push PWA (kilómetros lunes 8 AM UTC-6 fijo + reportes sin firmar/hora).
; TZ=UTC: Field corre con TZ=UTC; cron_avisos es inmune (usa utcnow()-6) pero se
; conserva igual para no mover comportamientos de datetime.now() del resto.
[program:avisos]
command=/usr/local/bin/python3.11 -u /app/api/cron_avisos.py
directory=/app/api
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/avisos.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
environment=TZ="UTC"
