[program:docker_cleanup_worker]
command=/usr/local/bin/python3.11 -u /app/cron_docker_cleanup.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/docker_cleanup_worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stopasgroup=true
killasgroup=true