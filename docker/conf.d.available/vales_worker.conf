[program:vales_worker]
command=/usr/local/bin/python3.11 -u cron_vales_autogenerate.py
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vales_worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
