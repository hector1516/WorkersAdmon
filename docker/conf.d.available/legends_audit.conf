; Origen: field/docker/supervisord.conf — migrado a workersadmon 2026-09-26.
; legends_audit: audita Scores/Partidas cada 300 s.
; ⚠️ REGLA DURA: SOLO PUEDE EXISTIR 1 INSTANCIA EN TODO EL ENTORNO
; (con uvicorn --workers 2 se duplicaba ScoreLog). Verificado el 2026-09-26:
; `field` ya no lo corre (solo nginx + api) y admon no lo tiene.
; TZ=UTC: mismo criterio que el resto de los workers de Field.
[program:legends_audit]
command=/usr/local/bin/python3.11 -u /app/api/legends_audit.py
directory=/app/api
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/legends_audit.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
environment=TZ="UTC"
