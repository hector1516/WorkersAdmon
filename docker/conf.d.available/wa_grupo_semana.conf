; Crónica semanal con IA del grupo ECCSita.
;
; Lunes 09:00-09:30 (hora de México) resume la semana ISO anterior si tiene
; mensajes y todavía no está RESUMIDA. La ventana y la IA se configuran en
; HUB_Config (wa_grupo_semana_dia, wa_grupo_semana_hora, wa_grupo_ia).
;
; Sin environment=TZ: el horario sale de tz_mx.now_mx() (UTC-6 fijo), no de
; datetime.now().
;
; Si la IA falla, la semana queda CAPTURADA y se registra en el log; no se
; guarda una crónica básica en su lugar.
[program:wa_grupo_semana]
command=python3 /app/wa_grupo_semana.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/wa_grupo_semana.log
stderr_logfile=/var/log/supervisor/wa_grupo_semana_err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true
