[program:pdf_storage_worker]
command=python3 /app/cron_sync_pdf_storage.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pdf_storage_worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
