; Reportes firmados al grupo «Servicios» de WhatsApp (OpenWA).
;
; Sin environment=TZ: la imagen ya corre con America/Mexico_City y el worker no
; usa datetime.now() para nada; las fechas del aviso salen de
; notif_messages.ahora_mx(), que es explícito (UTC-6 fijo).
[program:wa_firmados]
command=python3 /app/cron_whatsapp_firmados.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/wa_firmados.log
stderr_logfile=/var/log/supervisor/wa_firmados_err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true
