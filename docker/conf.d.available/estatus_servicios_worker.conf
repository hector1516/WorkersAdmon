[program:estatus_servicios_worker]
command=/usr/local/bin/python3.11 -u /app/cron_estatus_servicios.py
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/estatus_servicios_worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true