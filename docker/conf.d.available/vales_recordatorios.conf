[program:vales_recordatorios]
command=python3 -B /app/cron_vales_recordatorios.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/vales_recordatorios.log
stdout_logfile=/var/log/supervisor/vales_recordatorios.log
environment=PYTHONUNBUFFERED="1",RECORDATORIOS_CICLO_SEG="3600"
