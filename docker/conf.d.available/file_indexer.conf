; Origen: field/docker/supervisord.conf — migrado a workersadmon 2026-09-26.
; file_indexer: indexa Docs/Shared y Docs/Aplicaciones por SMB (FILESERVER
; 10.188.141.15, user hardcodeado en el script) a HUB_FileIndex cada 300 s.
; TZ=UTC: mismo criterio que el resto de los workers de Field.
[program:file_indexer]
command=/usr/local/bin/python3.11 -u /app/api/cron_index_files.py
directory=/app/api
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/file_indexer.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
environment=TZ="UTC"
