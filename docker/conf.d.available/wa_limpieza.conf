; Purga diaria de la bandeja de WhatsApp (OpenWA).
;
; Borra los mensajes de HUB_WhatsappEntrante y las conversaciones CERRADAS con
; más de wa_purga_dias días (default 90), en lotes de 500 y solo entre 03:00 y
; 03:30 hora de México. Revisa cada 30 min (WA_LIMPIEZA_CICLO_SEG).
;
; TZ=UTC y no la zona del host: el worker NO usa datetime.now(); toda la hora
; sale de tz_mx.now_mx(), que es UTC-6 fijo y explícito.
[program:wa_limpieza]
command=/usr/local/bin/python3.11 -u /app/wa_limpieza.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wa_limpieza.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
environment=TZ="UTC"
