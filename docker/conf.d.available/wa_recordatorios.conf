; Recordatorios proactivos del bot de WhatsApp (fase C): kilómetros sin
; registrar, vales sin comprobante y resumen del lunes.
;
; Sin environment=TZ: el worker no usa datetime.now() para nada; el horario y
; la ventana de envío salen de tz_mx.now_mx(), que es explícito (UTC-6 fijo).
;
; No manda nada fuera de lunes a viernes 09:00-18:30 ni a quien no tenga
; WhatsApp en HUB_UsuariosWhatsapp. El dedupe vive en HUB_WaRecordatorios
; (migración 0067).
[program:wa_recordatorios]
command=python3 /app/wa_recordatorios.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/wa_recordatorios.log
stderr_logfile=/var/log/supervisor/wa_recordatorios_err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true
