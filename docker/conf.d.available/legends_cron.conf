; Origen: field/docker/supervisord.conf — migrado a workersadmon 2026-09-26.
; legends_cron: sincroniza datos de Legends cada 3600 s.
; TZ=UTC: mismo criterio que el resto de los workers de Field.
[program:legends_cron]
command=/usr/local/bin/python3.11 -u /app/api/cron_legends.py
directory=/app/api
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/legends_cron.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
environment=TZ="UTC"
