[program:govale_vouchers_worker]
command=bash -c "find /app -name '*.pyc' -delete && find /app -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null; exec python3 -B /app/cron_sync_govale_vouchers.py"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/govale_vouchers_worker.log
stdout_logfile=/var/log/supervisor/govale_vouchers_worker.log
environment=PYTHONUNBUFFERED="1"
