[program:hubmail_worker]
command=bash -c "find /app -name '*.pyc' -delete && find /app -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null; exec python3 -B /app/cron_sync_hubmail.py"
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stderr_logfile=/var/log/supervisor/hubmail_worker.log
stdout_logfile=/var/log/supervisor/hubmail_worker.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true
stopwaitsecs=30
environment=PYTHONUNBUFFERED="1"

; NO se pone ninguna variable HUBMAIL_* aquí a propósito.
; Razón: este worker toca un buzón real, y una credencial escrita en un .conf
; versionado acaba en el historial de git. Las variables van por `docker run -e`
; (deploy/run_container.ps1, con deploy/env.local que está gitignored) o por el
; panel (pestaña Configuración → hubmail_worker), que las persiste en
; /data/worker_env.json y el entrypoint las reaplica en cada arranque.
;
; Las OBLIGATORIAS (sin ellas el worker no arranca bien):
;   HUBMAIL_DB_PASSWORD     contraseña de MySQL (HUBMAIL)
;   HUBMAIL_ENCRYPTION_KEY  clave Fernet con la que se cifraron las contraseñas
;                            de las cuentas IMAP. Alternativa: montar el volumen
;                            `hubmail_data` y dejar HUBMAIL_KEY_FILE.
;
; Las de operación (tienen default sensato, se pueden ajustar en caliente):
;   HUBMAIL_SYNC_PERIOD=300   segundos entre ciclos
;   HUBMAIL_SYNC_ENABLED=1    0 = proceso vivo pero NO sincroniza (corte)
;   HUBMAIL_SYNC_DRYRUN=0     1 = lee pero NO escribe en IMAP (ensayo)
;   HUBMAIL_VAPID_PUBLIC / HUBMAIL_VAPID_PRIVATE   push de correo nuevo
;   HUBMAIL_ATTACHMENTS_DIR=/data/attachments