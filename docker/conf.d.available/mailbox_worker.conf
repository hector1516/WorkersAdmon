[program:mailbox_worker]
; El motor de sincronización de la PWA ECCSA_Mailbox.
;
; REEMPLAZA a `hubmail_worker`, pero conviven durante el corte. Los dos pueden LEER
; al mismo tiempo sin problema; lo que no puede ser es que los dos ESCRIBAN (los
; dos drenarían la misma cola de envío y el cliente recibiría correos duplicados).
; El corte se hace con `MAILBOX_SYNC_ENABLED=0` en un lado y
; `HUBMAIL_SYNC_ENABLED=0` en el otro, nunca apagando el contenedor.
;
; El `find` de pyc NO es decorativo: el código se copia con `docker cp` desde
; Windows, y un `__pycache__` con fecha vieja hace que Python importe la versión
; anterior del módulo sin que nada avise. Es el modo de falla más caro de
; "desplegué y no cambió nada".
command=bash -c "find /app -name '*.pyc' -delete && find /app -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null; exec python3 -B /app/cron_sync_mailbox.py"
directory=/app
autostart=true
autorestart=true
startretries=3
; `startsecs=10`: si el worker arranca y muere a los 3 segundos (una BD caída, un
; candado ya tomado), supervisor lo cuenta como fallo, agota `startretries` y
; deja el proceso CAÍDO, que es lo honesto. Con 0, un worker que crash-loopea se
; ve "RUNNING" y nadie se entera hasta que alguien busca un correo que no llega.
startsecs=10
stderr_logfile=/var/log/supervisor/mailbox_worker.log
stdout_logfile=/var/log/supervisor/mailbox_worker.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true
; 30 s porque el ciclo se duerme en tramos de 1 s para poder parar rápido, pero un
; IMAP colgado puede tardar en soltar el socket.
stopwaitsecs=30
environment=PYTHONUNBUFFERED="1"

; ─────────────────────────────────────────────────────────────────────────────
; NO se pone ninguna variable MAILBOX_* aquí a propósito.
;
; Razón: este worker descifra CREDENCIALES DE CORREO REALES. Una clave escrita en
; un `.conf` versionado acaba en el historial de git para siempre, y `git rm` no
; la saca de ahí. Las variables van por `docker run -e` (deploy/run_container.ps1,
; con deploy/env.local que está gitignored) o por el panel (Workers →
; Configuración → mailbox_worker), que las persiste en /data/worker_env.json y el
; entrypoint las reaplica en cada arranque.
;
; Las OBLIGATORIAS (sin ellas el proceso NO arranca y dice por qué):
;   HUB_DB_SERVER / HUB_DB_USER / HUB_DB_PASSWORD / HUB_DB_DATABASE
;                       SQL Server `ECCSA_Admon` (compartido con Admon)
;   MAILBOX_ENCRYPTION_KEY  clave Fernet con la que el panel cifró las
;                           credenciales IMAP de las cuentas. Alternativa:
;                           MAILBOX_KEY_FILE apuntando a un archivo del volumen.
;                           Sin ella, `decrypt_secret` LANZA en vez de devolver
;                           "" (que sería conectar con contraseña vacía).
;   MAILBOX_STREAM_TOKEN    secreto compartido con la app. Sin él, el servidor de
;                           adjuntos responde 401 a todo y no se puede descargar
;                           ningún adjunto.
;
; Las de operación (default sensato, ajustable en caliente):
;   MAILBOX_SYNC_PERIOD=300       segundos entre ciclos
;   MAILBOX_SYNC_ENABLED=1        0 = proceso vivo pero NO sincroniza (corte)
;   MAILBOX_DRY_RUN=0             1 = lee pero NO escribe en IMAP (ensayo)
;   MAILBOX_CONCURRENCIA=4        cuentas en paralelo
;   MAILBOX_ESCALONAR=5           segundos entre conexiones IMAP del arranque
;   MAILBOX_VAPID_PRIVATE         push. TIENE QUE SER LA MISMA del service
;                                 worker de la app: si no, el navegador rechaza
;                                 cada push con un error que no dice "la llave
;                                 está mal".
;   MAILBOX_DATOS_DIR=/data/mailbox   volumen COMPARTIDO con la app. Si el
;                                 volumen no está en los dos contenedores, el
;                                 worker sincroniza perfecto y el usuario no ve
;                                 ningún correo, sin error en ninguna parte.
;   MAILBOX_DIAS_INDICE=365 / MAILBOX_HORAS_CUERPO=2160   retención
;   MAILBOX_INLINE_MAX_KB=256     tope de una imagen inline servida de una vez