; Avisos de asistencia por WhatsApp: entrada, ausencia, salida y resumen del
; viernes, solo al propio empleado.
;
; Sin environment=TZ: el horario y la ventana de envío salen de tz_mx.now_mx(),
; que es explícito (UTC-6 fijo).
;
; El horario es por persona (HUB_AsistenciaUsuarioHorario + ...Dias); una
; persona sin horario usa la oficina (L-V 09:00-18:30, sábado 09:30-13:30).
; El dedupe vive en HUB_WaAsistenciaAvisos (migración 0069).
[program:wa_asistencia]
command=python3 /app/wa_asistencia.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/wa_asistencia.log
stderr_logfile=/var/log/supervisor/wa_asistencia_err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true
