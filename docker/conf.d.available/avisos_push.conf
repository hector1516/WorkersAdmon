; Origen: nuevo 2026-10-06. Reemplaza a `avisos.conf` (cron_avisos.py), que quedó
; muerto: `api/routers/push.py` consulta `userId` sobre HUB_PushSubscriptions, que
; está indexada por `UserEmail`. Sus dos trabajos ya no se necesitan porque el
; despliegue nuevo usa HUB_PushSuscripciones (con columna App) y envía con
; pywebpush por correo, no por id de usuario.
;
; TZ=UTC: el worker NO usa datetime.now() para el horario. Todo el cálculo de
; "dentro de jornada" pasa por notif_dispatch.ahora_mx(), que es explícito.
[program:avisos_push]
command=/usr/local/bin/python3.11 -u /app/cron_avisos_push.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/avisos_push.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
environment=TZ="UTC"
