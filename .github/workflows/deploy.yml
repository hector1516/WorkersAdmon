# ─────────────────────────────────────────────────────────────────────────────
# WorkersAdmon · deploy automático
#
# El caso más fácil de los tres: el panel es Python de biblioteca estándar y se
# lee desde disco, así que no hay nada que compilar. El deploy es copiar el
# código al contenedor y reiniciar los procesos.
#
# Aun así hay un gate, por el mismo motivo que en Field y Admon: si el push toca
# Dockerfile, requirements.txt o docker/, hay que reconstruir la imagen (por
# ejemplo, para instalar paquetes nuevos o cambiar la conf de supervisor).
#
# El runner es self-hosted en el ServerVM. OJO: un folder de runner solo sirve
# a UN repo — si este workflow se queda en cola, es que el runner no está
# registrado en ESTE repo.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy WorkersAdmon

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos deploys a la vez: un push mientras corre el anterior se cancela.
concurrency:
  group: deploy-workersadmon
  # Un push nuevo cancela el anterior en vez de esperarlo en cola: si el
  # anterior esta atascado por falta de runner, el nuevo tampoco podria empezar.
  cancel-in-progress: true

jobs:
  # Por qué existe esto: un runner self-hosted registrado en un repo NO sirve
  # para otro, y si al repo no se le registra uno, su workflow se queda en
  # "queued" PARA SIEMPRE y sin decir por qué. GitHub no avisa.
  #
  # No se puede consultar la API de runners desde el workflow: exige permiso de
  # administración de repos, que el GITHUB_TOKEN no tiene (devuelve 403). Así
  # que en vez de preguntar, este job hace las dos cosas que sí puede con
  # `actions: write`:
  #   1. cancela Deploys que llevan atascados más de N minutos, y
  #   2. deja un comentario que dice qué hacer.
  # Además, el push nuevo nunca queda esperando al anterior: ver
  # cancel-in-progress arriba.
  #
  # Si esto aparece, el arreglo es registrar un runner para ESTE repo, con
  # folder y nombre propios (un folder de runner solo sirve para un repo).
  desbloquear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write      # para cancelar y comentar
      contents: read
    steps:
      - name: Cancelar deploys atascados
        env:
          GH_TOKEN: ${{ github.token }}
          ATASCADO_MIN: 10
        run: |
          set -euo pipefail
          ATASCADO=$(gh api "repos/${{ github.repository }}/actions/runs?status=queued" \
            --jq '[.workflow_runs[] | select(.name | startswith("Deploy"))
                   | select(.created_at < "'"$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)"'")] | length' 2>/dev/null || echo 0)
          echo "Deploys en cola hace más de $ATASCADO_MIN min: $ATASCADO"
          if [ "$ATASCADO" -eq 0 ]; then
            echo "::notice::nada atascado"
            exit 0
          fi
          echo "::error::$ATASCADO deploy(s) llevan más de $ATASCADO_MIN min en cola."
          echo "::error::Casi siempre es que este repo NO tiene un runner self-hosted"
          echo "::error::online. El registro es por repo, con folder y nombre propios."
          echo "::error::Se cancelan para que no bloqueen el siguiente push."
          for id in $(gh api "repos/${{ github.repository }}/actions/runs?status=queued" \
              --jq '.workflow_runs[] | select(.name | startswith("Deploy")) | .id'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" >/dev/null 2>&1 \
              && echo "  cancelado $id" || true
          done

  deploy:
    runs-on: self-hosted
    # El runner es Windows. `shell: bash` ahí NO es Git Bash sino
    # C:\Windows\system32\bash.exe (el de WSL), que en esta máquina no
    # está instalado y falla con 'Subsystem for Linux not installed'.
    # Por eso los pasos de bash apuntan explícitamente al Git Bash.

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decidir rebuild vs hotsync
        id: gate
        shell: 'C:\Program Files\Git\bin\bash.exe -e {0}'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          echo "Cambios entre $BEFORE y $AFTER:"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || [ "$BEFORE" = "" ]; then
            echo "modo=rebuild" >> "$GITHUB_OUTPUT"
            echo "motivo=sin referencia para comparar" >> "$GITHUB_OUTPUT"
            echo "::notice::primer push: rebuild"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
          echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -qE '^(Dockerfile|requirements\.txt|docker/)'; then
            echo "modo=rebuild" >> "$GITHUB_OUTPUT"
            echo "motivo=cambió la imagen (Dockerfile / requirements / docker/)" >> "$GITHUB_OUTPUT"
            echo "::notice::modo REBUILD: cambió un insumo de la imagen"
          else
            echo "modo=hotsync" >> "$GITHUB_OUTPUT"
            echo "motivo=solo cambió código Python, CSS y estáticos" >> "$GITHUB_OUTPUT"
            echo "::notice::modo HOTSYNC: sin rebuild"
          fi

      - name: Resumen
        shell: 'C:\Program Files\Git\bin\bash.exe -e {0}'
        run: |
          echo "### Deploy de WorkersAdmon" >> "$GITHUB_STEP_SUMMARY"
          echo "- **modo**: ${{ steps.gate.outputs.modo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **por qué**: ${{ steps.gate.outputs.motivo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Hotsync
        if: steps.gate.outputs.modo == 'hotsync'
        shell: 'C:\Program Files\Git\bin\bash.exe -e {0}'
        run: bash deploy/hotsync.sh

      # El rebuild NO se corre desde el checkout del runner: build.bat espera el
      # clon canónico (C:\WorkersAdmon) y así el contenedor se recrea con la
      # misma configuración de siempre. Se lanza la tarea ya probada, que es
      # además el patrón del ServerVM: por SSH los procesos hijos mueren al
      # cerrarse la sesión, por eso esto va con schtasks.
      - name: Rebuild
        if: steps.gate.outputs.modo == 'rebuild'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Lanzando WorkersBuild (schtasks)…"
          schtasks /run /tn WorkersBuild
          if ($LASTEXITCODE -ne 0) { throw "no se pudo lanzar WorkersBuild" }

          Write-Host "Esperando a que termine (build.log)…"
          $rc = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 10
            $log = Get-Content 'C:\WorkersAdmon\build.log' -ErrorAction SilentlyContinue
            $line = $log | Select-String 'FIN rc=(\d+)' | Select-Object -Last 1
            if ($line) {
              $log | Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
              $rc = [int]$line.Matches[0].Groups[1].Value
              break
            }
          }
          if ($null -eq $rc) { throw "build.log no mostró 'FIN rc=' en 15 min" }
          if ($rc -ne 0) { throw "el rebuild falló (rc=$rc) — ver C:\WorkersAdmon\build.log" }
          Write-Host "OK · imagen reconstruida"
