# ─────────────────────────────────────────────────────────────────────────────
# WorkersAdmon · deploy automático
#
# El caso más fácil de los tres: el panel es Python de biblioteca estándar y se
# lee desde disco, así que no hay nada que compilar. El deploy es copiar el
# código al contenedor y reiniciar los procesos.
#
# Aun así hay un gate: si el push toca Dockerfile, requirements.txt o docker/,
# hay que reconstruir la imagen (por ejemplo para instalar paquetes nuevos o
# cambiar la conf de supervisor). El resto va por el camino rápido.
#
# ── Sobre el shell de los pasos ──────────────────────────────────────────────
# El runner es WINDOWS. Ahí `shell: bash` no es Git Bash sino
# C:\Windows\system32\bash.exe (el de WSL), que no está instalado en el
# ServerVM: el paso muere con "Subsystem for Linux not installed" y sale con
# código 1 sin explicar nada. Tampoco sirve poner la ruta del Git Bash en
# `shell:` — el runner intenta resolver {0} como ruta y falla con
# "Second path fragment must not be a drive or UNC name".
#
# Por eso los pasos van en PowerShell, y el que tiene que correr un .sh
# invoca al Git Bash explícitamente.
#
# ── Sobre el runner ──────────────────────────────────────────────────────────
# Cada repo necesita su propio runner (un folder de runner solo sirve para uno).
# Este está en C:\actions-runner-workers, nombre WorkersAdmon-Runner,-label
# `self-hosted,windows`. Si el deploy queda en cola, es que ese runner no está
# online; el job 'desbloquear' de abajo lo detecta y lo cancela para que no
# bloquee el siguiente push.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy WorkersAdmon

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo cancela el anterior en vez de esperarlo en cola: si el anterior
# está atascado por falta de runner, el nuevo tampoco podría arrancar.
concurrency:
  group: deploy-workersadmon
  cancel-in-progress: true

jobs:
  # No se puede consultar la API de runners desde el workflow: exige permiso de
  # administración de repos, que GITHUB_TOKEN no tiene (devuelve 403). Así que
  # en vez de preguntar, este job usa solo `actions: write` (que sí tiene) para
  # cancelar los Deploys atascados y dejar dicho cuál es la causa habitual.
  desbloquear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancelar deploys atascados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIMITE=$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          ATASCADOS=$(gh api "repos/${{ github.repository }}/actions/runs?status=queued" \
            --jq "[.workflow_runs[] | select(.name | startswith(\"Deploy\"))
                   | select(.created_at < \"$LIMITE\")] | .[] | .id")
          if [ -z "$ATASCADOS" ]; then
            echo "::notice::nada atascado"
            exit 0
          echo "::error::deploy(s) con más de 10 min en cola: $(echo "$ATASCADOS" | tr '\n' ' ')"
          echo "::error::casi siempre es que este repo NO tiene un runner self-hosted"
          echo "::error::online. El registro es por repo, con folder y nombre propios."
          echo "$ATASCADOS" | while read -r id; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" >/dev/null 2>&1 \
              && echo "  cancelado $id" || true
          done

  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # El hotsync necesita el código; con historial completo el gate puede
          # comparar contra el push anterior.
          fetch-depth: 0

      # ── El gate ────────────────────────────────────────────────────────────
      - name: Decidir rebuild vs hotsync
        id: gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $before = '${{ github.event.before }}'
          $after  = '${{ github.event.after }}'
          $salida = $env:GITHUB_OUTPUT

          if ([string]::IsNullOrEmpty($before) -or $before -eq ('0' * 40)) {
            Write-Output "primer push: rebuild (no hay contra que comparar)"
            "modo=rebuild" | Out-File -FilePath $salida -Append -Encoding utf8
            "motivo=sin referencia previa" | Out-File -FilePath $salida -Append -Encoding utf8
            exit 0
          }

          $changed = @(git diff --name-only $before $after 2>$null)
          Write-Output "Cambios en este push: $($changed.Count)"
          $changed | ForEach-Object { "  $_" }

          # Lo que de verdad cambia la imagen. El resto (frontend, panel,
          # estaticos) se publica copiando al contenedor que ya corre, sin
          # docker build.
          $imagen = @("Dockerfile", "requirements.txt", "docker/")
          $tocaba = $changed | Where-Object {
            $f = $_
            $imagen | Where-Object { $f -eq $_ -or $f -like "$_/*" }
          }

          if ($tocaba) {
            Write-Output "modo=REBUILD: cambiaron $($tocaba -join ', ')"
            "modo=rebuild" | Out-File -FilePath $salida -Append -Encoding utf8
            "motivo=cambio un insumo de la imagen" | Out-File -FilePath $salida -Append -Encoding utf8
          } else {
            Write-Output "modo=HOTSYNC: sin rebuild"
            "modo=hotsync" | Out-File -FilePath $salida -Append -Encoding utf8
            "motivo=solo cambio codigo y estaticos" | Out-File -FilePath $salida -Append -Encoding utf8
          }

      - name: Resumen
        shell: pwsh
        run: |
          "### Deploy de WorkersAdmon" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- **modo**: ${{ steps.gate.outputs.modo }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- **por qué**: ${{ steps.gate.outputs.motivo }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- **commit**: ``${{ github.sha }}``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ── Camino rápido ──────────────────────────────────────────────────────
      - name: Hotsync
        if: steps.gate.outputs.modo == 'hotsync'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git Bash no esta en $bash" }
          & $bash deploy/hotsync.sh
          if ($LASTEXITCODE -ne 0) { throw "hotsync.sh fallo (rc=$LASTEXITCODE)" }

      # ── Camino completo ────────────────────────────────────────────────────
      # El rebuild NO se corre desde el checkout del runner: build.bat espera el
      # clon canónico (C:\WorkersAdmon) y así el contenedor se recrea con la
      # misma configuración de siempre. Y va por schtasks, no por SSH, porque
      # Windows mata los procesos hijos al cerrarse la sesión.
      - name: Rebuild
        if: steps.gate.outputs.modo == 'rebuild'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Lanzando WorkersBuild (schtasks)…"
          schtasks /run /tn WorkersBuild
          if ($LASTEXITCODE -ne 0) { throw "no se pudo lanzar WorkersBuild" }

          Write-Host "Esperando a que termine (build.log)…"
          $rc = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 10
            $log = Get-Content 'C:\WorkersAdmon\build.log' -ErrorAction SilentlyContinue
            $line = $log | Select-String 'FIN rc=(\d+)' | Select-Object -Last 1
            if ($line) {
              $log | Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
              $rc = [int]$line.Matches[0].Groups[1].Value
              break
            }
          }
          if ($null -eq $rc) { throw "build.log no mostró 'FIN rc=' en 15 min" }
          if ($rc -ne 0) { throw "el rebuild falló (rc=$rc) - ver C:\WorkersAdmon\build.log" }
          Write-Host "OK · imagen reconstruida"
