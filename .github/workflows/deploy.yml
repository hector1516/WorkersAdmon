# ─────────────────────────────────────────────────────────────────────────────
# WorkersAdmon · deploy automático
#
# La idea: no reconstruir la imagen en cada push. El gate mira QUÉ archivos
# cambió y elige entre dos caminos:
#
#   rebuild  → deploy/build.bat (reconstruye la imagen y recrea el
#              contenedor, con el rollback que ya tenía). Se usa cuando el push
#              tocó un insumo de la IMAGEN: Dockerfile / requirements.txt / docker/
#   hotsync  → deploy/hotsync.sh (compila lo estático y lo copia al contenedor
#              que ya corre). Se usa para todo lo demás: .svelte, .css, .py.
#
# ── Sobre el shell de los pasos ──────────────────────────────────────────────
# El runner es WINDOWS con Windows PowerShell 5.1. No hay PowerShell 7, así que
# `shell: pwsh` muere con "pwsh: command not found". Y `shell: bash` tampoco
# sirve: en Windows apunta a C:\Windows\system32\bash.exe, que es el de WSL y no
# está instalado en el ServerVM. Por eso los pasos van en `shell: powershell`, y
# el único que necesita un .sh (el hotsync) invoca al Git Bash explícitamente.
#
# Por lo mismo las salidas se escriben con [IO.File]::AppendAllText y no con
# `Out-File -Encoding utf8`: en PowerShell 5.1 eso mete BOM, y un BOM al
# principio de $GITHUB_OUTPUT hace que GitHub no lea las variables del gate.
#
# ── Sobre el runner ──────────────────────────────────────────────────────────
# Cada repo necesita su propio runner: un folder de runner solo sirve para uno.
# Este está en C:\actions-runner-workers, nombre WorkersAdmon-Runner, labels self-hosted,windows.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy WorkersAdmon

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo cancela el anterior en vez de esperarlo en cola: si el anterior
# está atascado por falta de runner, el nuevo tampoco podría arrancar. Con
# cancel-in-progress en false, uno atascado retenía el grupo y congelaba todos
# los deploys siguientes.
concurrency:
  group: deploy-workersadmon
  cancel-in-progress: true

jobs:
  # No se puede consultar la API de runners desde el workflow: exige permiso de
  # administración de repos, que GITHUB_TOKEN no tiene (devuelve 403), así que
  # un guard que la consulte concluye "no hay runner" aunque lo haya. En vez de
  # preguntar, este job usa solo `actions: write` (que sí tiene): cancela los
  # Deploys atascados más de 10 min y dice cuál es la causa habitual.
  desbloquear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancelar deploys atascados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIMITE=$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          ATASCADOS=$(gh api "repos/${{ github.repository }}/actions/runs?status=queued" \
            --jq "[.workflow_runs[] | select(.name | startswith(\"Deploy\"))
                   | select(.created_at < \"$LIMITE\")] | .[] | .id")
          if [ -z "$ATASCADOS" ]; then
            echo "::notice::nada atascado"
            exit 0
          fi
          echo "::error::deploy(s) con más de 10 min en cola: $(echo "$ATASCADOS" | tr '\n' ' ')"
          echo "::error::casi siempre es que este repo NO tiene un runner self-hosted"
          echo "::error::online. El registro es por repo, con folder y nombre propios."
          echo "$ATASCADOS" | while read -r id; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" >/dev/null 2>&1 \
              && echo "  cancelado $id" || true
          done

  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # El hotsync necesita el código, y el gate necesita historial para
          # comparar contra el push anterior.
          fetch-depth: 0

      - name: Decidir rebuild vs hotsync
        id: gate
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          function Add-Output($k, $v) {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$k=$v`n")
          }
          $before = '${{ github.event.before }}'
          $after  = '${{ github.event.after }}'

          if ([string]::IsNullOrEmpty($before) -or $before -eq ('0' * 40)) {
            Write-Output "primer push: rebuild (no hay contra qué comparar)"
            Add-Output 'modo' 'rebuild'
            Add-Output 'motivo' 'sin referencia previa'
            exit 0
          }

          # `git diff` con ErrorActionPreference=Stop es problemático en
          # Windows PowerShell 5.1: si el comando escribe en stderr (sha
          # desconocida, repo shallow) se convierte en error terminante y el
          # paso muere. Se aísla la llamada y, si no se puede diffear, se
          # reconstruye: es el camino conservador. Nunca adivinar "hotsync".
          $changed = @()
          $ok = $false
          try {
            $ErrorActionPreference = 'Continue'
            $raw = & git diff --name-only $before $after 2>$null
            $ok = ($LASTEXITCODE -eq 0)
            $ErrorActionPreference = 'Stop'
            if ($ok) { $changed = @($raw) }
          } catch {
            $ok = $false
          }
          if (-not $ok -or $changed.Count -eq 0) {
            Write-Output "no se pudo diffear el push; se reconstruye por seguridad"
            Add-Output 'modo' 'rebuild'
            Add-Output 'motivo' 'no se pudo determinar que cambio'
            exit 0
          }
          Write-Output "Cambios en este push: $($changed.Count)"
          $changed | ForEach-Object { "  $_" }

          # Lo que de verdad cambia la imagen. Todo lo demás se publica
          # copiando al contenedor que ya corre, sin docker build.
          $imagen = @("Dockerfile", "requirements.txt", "docker/")
          $tocaba = $changed | Where-Object {
            $f = $_
            $imagen | Where-Object { $f -eq $_ -or $f -like "$_/*" }
          }

          if ($tocaba) {
            Write-Output "modo=REBUILD: cambiaron $($tocaba -join ', ')"
            Add-Output 'modo' 'rebuild'
            Add-Output 'motivo' 'cambio un insumo de la imagen'
          } else {
            Write-Output "modo=HOTSYNC: sin rebuild"
            Add-Output 'modo' 'hotsync'
            Add-Output 'motivo' 'solo cambio codigo y estaticos'
          }

      - name: Resumen
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        run: |
          $s = $env:GITHUB_STEP_SUMMARY
          [IO.File]::AppendAllText($s, "### Deploy de WorkersAdmon`n`n")
          [IO.File]::AppendAllText($s, "- **modo**: ${{ steps.gate.outputs.modo }}`n")
          [IO.File]::AppendAllText($s, "- **por qué**: ${{ steps.gate.outputs.motivo }}`n")
          [IO.File]::AppendAllText($s, "- **commit**: ${{ github.sha }}`n")

      - name: Hotsync
        if: steps.gate.outputs.modo == 'hotsync'
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git Bash no está en $bash" }
          & $bash deploy/hotsync.sh
          if ($LASTEXITCODE -ne 0) { throw "hotsync.sh falló (rc=$LASTEXITCODE)" }

      # ── Camino completo ────────────────────────────────────────────────────
      # El rebuild NO se corre desde el checkout del runner: el script espera el
      # clon canónico (C:\WorkersAdmon) y así el contenedor se recrea con la misma
      # configuración de siempre (puertos, red, volumes y credenciales que saca
      # del contenedor actual). Y va por schtasks, no por SSH, porque Windows
      # mata los procesos hijos al cerrarse la sesión.
      - name: Rebuild
        if: steps.gate.outputs.modo == 'rebuild'
        shell: 'powershell -ExecutionPolicy Bypass -command ". {0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Lanzando WorkersBuild (schtasks)…"
          schtasks /run /tn WorkersBuild
          if ($LASTEXITCODE -ne 0) { throw "no se pudo lanzar WorkersBuild" }

          Write-Host "Esperando a que termine (build.log)…"
          $rc = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 10
            $log = Get-Content 'C:\WorkersAdmon\build.log' -ErrorAction SilentlyContinue
            $line = $log | Select-String 'FIN rc=(\d+)' | Select-Object -Last 1
            if ($line) {
              $log | Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
              $rc = [int]$line.Matches[0].Groups[1].Value
              break
            }
          }
          if ($null -eq $rc) { throw "build.log no mostró 'FIN rc=' a tiempo" }
          if ($rc -ne 0) { throw "el rebuild falló (rc=$rc) — ver C:\WorkersAdmon\build.log" }
          Write-Host "OK · imagen reconstruida y contenedor recreado"
