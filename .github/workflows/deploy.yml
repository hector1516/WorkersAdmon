# ─────────────────────────────────────────────────────────────────────────────
# WorkersAdmon · build de la imagen
#
# ESTÁNDAR (igual en las 6 apps):
#   build + push a ghcr.io en la nube → Arcane ve el digest → Update a mano.
#
# ── Qué cambió y por qué ──────────────────────────────────────────────────────
# Antes el build corría en un runner WINDOWS propio de este repo: el paso
# Rebuild llamaba a deploy/build.ps1 (PowerShell 5.1), que compilaba con
# `docker build --build-arg WITH_PLAYWRIGHT=1` y luego recreaba el contenedor;
# otro paso mantenía un clon canónico en C:\WorkersAdmon. El gate elegía entre
# rebuild y hotsync según qué archivos hubiera cambiado.
#
# Tres cosas estaban mal:
#   1. No publicaba en ghcr.io, así que Arcane NUNCA veía actualizaciones de
#      esta app. Era la única que seguía fuera del flujo estándar.
#   2. Recreaba el contenedor por fuera de Arcane. Siendo un Project de Arcane,
#      eso lo deja sin contenedor.
#   3. Ataba la maquina windows a este repo: un folder de runner por repositorio.
#
# Ahora solo se construye y publica. Del lado del servidor no queda nada que
# hacer. Para publicar una version nueva:
#
#   1. push a main
#   2. la CI publica en ghcr.io/hector1516/workersadmon
#   3. Arcane → Projects → workersadmon → Updates → Update
#
# deploy/build.ps1, build.bat, run_container.ps1 y register_task.ps1 quedan sin
# uso. No se borran en este commit por si hay que volver atrás.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy WorkersAdmon

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo cancela el anterior en vez de esperarlo en cola: si el anterior
# está atascado por falta de runner, el nuevo tampoco podría arrancar. Con
# cancel-in-progress en false, uno atascado retenía el grupo y congelaba todos
# los deploys siguientes.
concurrency:
  group: deploy-workersadmon
  cancel-in-progress: true

jobs:
  desbloquear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancelar deploys atascados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIMITE=$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          ATASCADOS=$(gh api "repos/${{ github.repository }}/actions/runs?status=queued" \
            --jq "[.workflow_runs[] | select(.name | startswith(\"Deploy\"))
                   | select(.created_at < \"$LIMITE\")] | .[] | .id")
          if [ -z "$ATASCADOS" ]; then
            echo "::notice::nada atascado"
            exit 0
          fi
          echo "::error::deploy(s) con mas de 10 min en cola: $(echo "$ATASCADOS" | tr '\n' ' ')"
          echo "::error::casi siempre es que este repo NO tiene un runner self-hosted"
          echo "::error::online. El registro es por repo, con folder y nombre propios."
          echo "$ATASCADOS" | while read -r id; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" >/dev/null 2>&1 \
              && echo "  cancelado $id" || true
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # ESTÁNDAR DE DESPLIEGUE — el mismo en las 6 apps:
  #   1. build + push a ghcr.io, AQUÍ en la nube
  #   2. el servidor no hace NADA — no compila, no baja, no recrea
  #   3. Arcane ve el digest nuevo y el operador da "Update" en la UI
  #
  # Antes esto corría en un runner WINDOWS: deploy/build.ps1 compilaba con
  # PowerShell 5.1, sincronizaba un clon canónico en C:\WorkersAdmon y recreaba
  # el contenedor. Tres problemas:
  #   · no publicaba en ghcr.io, así que Arcane nunca veía actualizaciones
  #   · el build ataba la maquina windows a este repo (un folder de runner)
  #   · recrear el contenedor por fuera de Arcane lo dejaba sin Project
  #
  # El build-arg WITH_PLAYWRIGHT=1 se conserva: es el que trae los navegadores
  # para los workers que los necesitan.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    needs: desbloquear
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: WITH_PLAYWRIGHT=1
          tags: |
            ghcr.io/${{ github.repository_owner }}/workersadmon:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/workersadmon:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada en la nube"
            echo ""
            echo "- **sha**: \`${{ github.sha }}\`"
            echo "- **tags**: \`ghcr.io/hector1516/workersadmon\` → :latest + :sha"
            echo "- **build-arg**: WITH_PLAYWRIGHT=1"
            echo "- **runner**: \`${{ runner.name }}\` (nube — nada se compiló en el servidor)"
            echo ""
            echo "Arcane ya la ve como actualización pendiente:"
            echo "**Projects → workersadmon → Updates → Update**."
            echo ""
            echo "Ya no se usa el runner Windows ni \`deploy/build.ps1\`."
          } >> "$GITHUB_STEP_SUMMARY"
